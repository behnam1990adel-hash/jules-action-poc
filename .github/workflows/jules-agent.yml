name: Jules Agent (PoC)

on:
  issues:
    types: [labeled]

jobs:
  run-jules:
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jules on issue content
        uses: google-labs-code/jules-action@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          repo: ${{ github.repository }}
          prompt: ${{ github.event.issue.body }}
          source_branch: main
